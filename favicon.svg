<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg { fill: #F9F3E6; }
      .border { stroke: #2D2D2D; stroke-width: 4; fill: none; }
      .orbit { stroke: #5B9EA6; stroke-width: 3.5; fill: none; opacity: 0.9; }
      .bottle { fill: #F9F3E6; stroke: #2D2D2D; stroke-width: 4; stroke-linejoin: round; }
      .cap { fill: #B83A2E; stroke: #2D2D2D; stroke-width: 3; }
      .b-text { font-family: "Arial Black", "Impact", sans-serif; font-size: 38px; font-weight: 900; fill: #B83A2E; text-anchor: middle; }
    </style>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="50" cy="50" r="47" class="bg"/>
  <circle cx="50" cy="50" r="47" class="border"/>

  <!-- Atomic Orbital Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(30 50 50)" class="orbit"/>
  <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(90 50 50)" class="orbit"/>
  <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(150 50 50)" class="orbit"/>

  <!-- Center Swing-Top Bottle Silhouette -->
  <rect x="42" y="11" width="16" height="7" rx="2" class="cap"/>
  <line x1="38" y1="18" x2="62" y2="18" stroke="#2D2D2D" stroke-width="3"/>
  <line x1="41" y1="24" x2="59" y2="24" stroke="#2D2D2D" stroke-width="2.5"/>

  <!-- Bottle Body -->
  <path d="M43 18 L57 18 L57 28 C57 34 68 40 68 50 L68 81 C68 85 64 87 50 87 C36 87 32 85 32 81 L32 50 C32 40 43 34 43 28 Z" class="bottle"/>
  
  <!-- Bold B Emblem -->
  <text x="50" y="67" class="b-text">B</text>
  
  <!-- Subtle Liquid Fill Line -->
  <path d="M36 78 C42 80 58 80 64 78" stroke="#B83A2E" stroke-width="3" stroke-linecap="round"/>
</svg>